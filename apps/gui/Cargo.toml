[package]
name = "membase-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MemBase 桌面界面（egui）：内存基准线 + 桌面图标布局，全部动作都有等价命令行"
build = "build.rs"

[[bin]]
name = "MemBase"
path = "src/main.rs"

[dependencies]
membase-core.workspace = true
membase-win = { workspace = true, features = ["preview"] }
membase-cli.workspace = true
eframe.workspace = true
rfd.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lints]
workspace = true
